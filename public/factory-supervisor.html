<!-- @format -->
<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>هايبر تك — المشرف</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/theme.css" />
    <script src="JS/theme-switcher.js"></script>
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/contacts.css" />
    <link rel="stylesheet" href="CSS/responsive.css" />
    <link rel="stylesheet" href="CSS/enhancements.css" />
    <style>
      html:not([data-role="supervisor"]):not([data-role="production_controller"]):not([data-role="chairman"]):not([data-role="production_manager"])
        .page-guard {
        display: none !important;
      }
      html:not([data-role="supervisor"]):not([data-role="production_controller"]):not([data-role="chairman"]):not([data-role="production_manager"])
        .page-denied {
        display: flex !important;
      }
      .page-denied {
        display: none;
        min-height: 60vh;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        color: var(--text-muted);
      }
      .sv-card {
        background: var(--card-bg, #12161f);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
        max-width: 620px;
      }
      .sv-card .num {
        font-weight: 700;
      }
      .sv-card .meta {
        font-size: 12px;
        color: var(--text-muted);
        margin: 6px 0;
      }
      .stage-track {
        display: flex;
        gap: 6px;
        margin: 12px 0;
      }
      .stage-step {
        flex: 1;
        text-align: center;
        font-size: 11px;
        padding: 6px 4px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-muted);
      }
      .stage-step.done {
        background: var(--green, #10b981);
        color: #fff;
      }
      .stage-step.current {
        background: var(--primary, #3b82f6);
        color: #fff;
      }
      .empty-hint {
        font-size: 12px;
        color: var(--text-muted);
        text-align: center;
        padding: 20px 0;
      }
      .archive-card {
        background: rgba(16, 185, 129, 0.05);
        border: 1px solid rgba(16, 185, 129, 0.2);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 10px;
        max-width: 620px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .archive-card .archive-icon {
        color: var(--green, #10b981);
        font-size: 18px;
        flex-shrink: 0;
      }
      .archive-card .num {
        font-weight: 700;
        font-size: 13px;
      }
      .archive-card .meta {
        font-size: 11.5px;
        color: var(--text-muted);
        margin-top: 3px;
      }
      .archive-card .badge {
        margin-right: auto;
        font-size: 10.5px;
        padding: 3px 9px;
        border-radius: 20px;
        background: rgba(16, 185, 129, 0.15);
        color: var(--green, #10b981);
        white-space: nowrap;
      }
    </style>
  </head>
  <body data-allowed-roles="chairman,production_manager,supervisor">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">⚡</div>
        <div class="logo-text">
          <h1>هايبر تك</h1>
          <span>نظام إدارة الموارد</span>
        </div>
      </div>

      <div class="sidebar-section">
        <p class="sidebar-section-title">الرئيسية</p>
        <a href="index.html" class="nav-item">
          <i class="fa-solid fa-gauge-high"></i>
          لوحة التحكم
        </a>
      </div>

      <!-- ✅ يتملى ديناميكيًا بالأقسام/الصفحات المسموح بيها للمستخدم الحالي بس -->
      <div id="dynamic-sidebar"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h2>المشرف — أوامري الحالية</h2>
          <p>تابع مراحل التنفيذ خطوة بخطوة</p>
        </div>
        <div class="topbar-actions">
          <div class="icon-btn">
            <i class="fa-regular fa-bell"></i>
            <div class="notif-dot"></div>
          </div>
          <div class="icon-btn"></div>
        </div>
      </header>

      <div class="page-denied">
        <i class="fa-solid fa-lock" style="font-size: 32px"></i>
        <p>هذه الصفحة متاحة للمشرف أو المدير الكامل فقط.</p>
      </div>

      <div class="page-guard" style="padding: 20px 28px">
        <div id="sv-list"><p class="empty-hint">جاري التحميل...</p></div>

        <div
          style="
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
          "
        >
          <div
            style="
              display: flex;
              align-items: center;
              gap: 8px;
              margin-bottom: 14px;
              color: var(--text-muted);
              font-size: 13px;
              font-weight: 700;
            "
          >
            <i class="fa-solid fa-clock-rotate-left"></i> سجل الأوامر المنتهية
            اللي أشرفت عليها
          </div>
          <div id="sv-archive"><p class="empty-hint">جاري التحميل...</p></div>
        </div>
      </div>
    </main>

    <div class="toast" id="toast">
      <i class="fa-solid fa-circle-check"></i><span id="toast-msg">تم</span>
    </div>

    <script src="JS/auth.js"></script>
    <script src="JS/page-guard.js"></script>
    <script src="JS/nav-loader.js"></script>
    <script src="JS/enhancements.js"></script>
    <script src="JS/production-workflow-shared.js"></script>
    <script src="JS/factory-supervisor.js"></script>
  </body>
</html>
