<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ورشة عمل المبيعات — Hyper-Tech</title>
    <link rel="stylesheet" href="CSS/theme.css" />
    <script src="JS/theme-switcher.js"></script>
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/sales.css" />
  </head>
  <body data-allowed-roles="executive_manager,sales_manager,online_seller,offline_seller,hr,hr_manager,chairman">
    <main class="main" style="margin:0">
      <header class="topbar"><h1>ورشة عمل المبيعات</h1><a href="sales.html">المبيعات</a></header>
      <div class="content">
        <div class="page-header">
          <div>
            <p class="eyebrow">مراجعة قبل الإنتاج</p>
            <h2>كل حاجة محتاجة ردّك <span id="needs-response-count" class="badge-count" style="display:none"></span></h2>
          </div>
          <button class="btn-primary" id="refresh-orders">تحديث</button>
        </div>

        <!-- Phase 7: تبويبين — طلبات معلّقة (موجودة من قبل) وطلبات أسعار (المرحلة 6) -->
        <div class="workspace-tabs">
          <button type="button" class="workspace-tab active" data-tab="orders" id="tab-orders">
            طلبات معلّقة <span id="orders-count" class="tab-count"></span>
          </button>
          <button type="button" class="workspace-tab" data-tab="inquiries" id="tab-inquiries">
            طلبات أسعار <span id="inquiries-count" class="tab-count"></span>
          </button>
        </div>

        <div class="workspace-filter">
          <input type="text" id="customer-filter" placeholder="ابحث باسم العميل..." />
        </div>

        <div id="portal-orders-list" class="workspace-panel"></div>
        <div id="price-inquiries-list" class="workspace-panel" style="display:none"></div>
      </div>
    </main>

    <!-- Phase 7: نافذة تأكيد عامة — بديل عن prompt()/confirm() الافتراضية بتاعة
         المتصفح. بتعيد استخدام نفس أسلوب .confirm-overlay/.confirm-dialog
         الموجود بالفعل في CSS/style.css (نفس الشكل المستخدم في صفحات تانية
         زي المخزون)، ومضاف عليها بس خانة سبب/سعر اختيارية. -->
    <div class="confirm-overlay" id="confirm-overlay">
      <div class="confirm-dialog">
        <h3 id="confirm-title">تأكيد</h3>
        <p id="confirm-message"></p>
        <div id="confirm-reason-wrap" style="display:none">
          <textarea id="confirm-reason" rows="3" placeholder="اكتب السبب هنا..." class="confirm-extra-input"></textarea>
        </div>
        <div id="confirm-price-wrap" style="display:none">
          <input type="number" id="confirm-price" min="0" step="0.01" placeholder="السعر (اتركه فاضي لقبول السعر المقترح كما هو)" class="confirm-extra-input" />
        </div>
        <div class="confirm-actions">
          <button type="button" class="btn-ghost" id="confirm-cancel">إلغاء</button>
          <button type="button" class="btn-danger" id="confirm-ok">تأكيد</button>
        </div>
      </div>
    </div>

    <script src="JS/auth.js"></script>
    <script src="JS/page-guard.js"></script>
    <script src="JS/portal-orders.js"></script>
  </body>
</html>
