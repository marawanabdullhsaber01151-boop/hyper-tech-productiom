<!-- @format -->

<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تفعيل الحساب — Hyper-Tech</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-dark: #0b0f1a;
        --bg-card: #111827;
        --accent: #f59e0b;
        --accent-soft: rgba(245, 158, 11, 0.12);
        --text-main: #f1f5f9;
        --text-muted: #aab8cc;
        --text-dim: #475569;
        --border: rgba(255, 255, 255, 0.08);
        --red: #ef4444;
        --green: #10b981;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: var(--bg-dark);
        color: var(--text-main);
        font-family: "Tajawal", sans-serif;
      }
      .auth-box {
        width: 100%;
        max-width: 480px;
        padding: 32px 28px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--bg-card);
      }
      .auth-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .auth-logo-box {
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), #d97706);
        font-size: 20px;
      }
      .auth-logo span { font-size: 18px; font-weight: 800; }
      .auth-sub {
        margin: 0 0 26px;
        color: var(--text-muted);
        text-align: center;
        font-size: 13px;
        line-height: 1.8;
      }
      .field { margin-bottom: 15px; }
      .field label {
        display: block;
        margin-bottom: 6px;
        color: var(--text-muted);
        font-size: 12.5px;
      }
      .field input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 11px;
        outline: none;
        background: var(--bg-dark);
        color: var(--text-main);
        font: inherit;
      }
      .field input:focus { border-color: var(--accent); }
      .auth-submit {
        width: 100%;
        margin-top: 6px;
        padding: 14px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), #d97706);
        color: #1a1206;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
      .auth-submit:disabled { cursor: not-allowed; opacity: .55; }
      .message {
        display: none;
        margin-bottom: 15px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 12.5px;
        line-height: 1.8;
      }
      .message.show { display: block; }
      .message.error {
        border: 1px solid rgba(239, 68, 68, .3);
        background: rgba(239, 68, 68, .12);
        color: #fca5a5;
      }
      .message.success {
        border: 1px solid rgba(16, 185, 129, .3);
        background: rgba(16, 185, 129, .12);
        color: #a7f3d0;
      }
      .back-link {
        display: block;
        margin-top: 20px;
        color: var(--accent);
        text-align: center;
        font-size: 12.5px;
        font-weight: 700;
      }
      .hidden { display: none !important; }
      @media (max-width: 520px) {
        body { align-items: flex-start; padding: 12px; }
        .auth-box { margin-top: 10px; padding: 26px 18px; }
      }
    </style>
  </head>
  <body>
    <main class="auth-box">
      <div class="auth-logo">
        <div class="auth-logo-box">⚡</div>
        <span>Hyper-Tech</span>
      </div>
      <p class="auth-sub">
        فعّل حساب بوابة عملاء الجملة بتحديد كلمة مرور جديدة.
        رابط التفعيل صالح لمدة 24 ساعة ويُستخدم مرة واحدة فقط.
      </p>

      <div id="activate-error" class="message error" role="alert"></div>
      <div id="activate-success" class="message success" role="status"></div>

      <form id="activate-form">
        <div class="field">
          <label for="new-password">كلمة المرور الجديدة</label>
          <input id="new-password" type="password" minlength="6" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="confirm-password">تأكيد كلمة المرور</label>
          <input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required />
        </div>
        <button type="submit" class="auth-submit" id="activate-submit">
          <i class="fa-solid fa-key"></i> تفعيل الحساب
        </button>
      </form>

      <a class="back-link" href="portal-login.html">
        <i class="fa-solid fa-arrow-right"></i> رجوع لتسجيل الدخول
      </a>
    </main>
    <script src="JS/portal-activate.js"></script>
  </body>
</html>
