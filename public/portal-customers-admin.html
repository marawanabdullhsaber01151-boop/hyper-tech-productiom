<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هايبر تك — عملاء البوابة</title><link rel="stylesheet" href="CSS/theme.css" />
<script src="JS/theme-switcher.js"></script>
<link rel="stylesheet" href="CSS/style.css"><link rel="stylesheet" href="CSS/portal-customers-admin.css"></head>
<body data-allowed-roles="sales_manager,executive_manager,chairman">
<main class="customers-shell"><header><div><a href="index.html">← لوحة التحكم</a><h1>إدارة عملاء البوابة</h1><p>بيانات الحسابات وطلبات إعادة تعيين كلمة المرور.</p></div><button id="refresh" class="button primary">تحديث</button></header><div id="status" class="status"></div>
<section class="panel"><h2>طلبات إعادة التعيين</h2><div class="table-wrap"><table><thead><tr><th>العميل</th><th>الهاتف</th><th>تاريخ الطلب</th><th>إجراء</th></tr></thead><tbody id="resetRows"></tbody></table></div></section>
 <section class="panel"><div class="section-heading"><h2>حسابات العملاء</h2><div class="header-actions"><input id="customerSearch" class="input" type="search" placeholder="ابحث بالاسم أو الهاتف أو الشركة"><button id="exportCustomers" class="button">تصدير CSV</button></div></div><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الشركة</th><th>الهاتف</th><th>البريد</th><th>المحافظة</th><th>التصنيف</th><th>الحالة</th><th>الصحة</th><th>الحد الأدنى</th><th>تاريخ الإنشاء</th><th>إجراء</th></tr></thead><tbody id="customerRows"></tbody></table></div><div class="pagination"><button id="previousPage" class="button">السابق</button><span id="pageInfo" class="muted"></span><button id="nextPage" class="button">التالي</button></div></section></main>
 <dialog id="cityDialog" class="action-dialog"><form id="cityForm" method="dialog"><h2>تعديل محافظة العميل</h2><p id="cityCustomerName" class="muted"></p><label for="customerCity">المحافظة</label><select id="customerCity" class="input"><option value="">اختر المحافظة...</option></select><div class="dialog-actions"><button type="button" class="button" data-close-city>إلغاء</button><button type="submit" class="button primary">حفظ</button></div></form></dialog>
 <script src="JS/auth.js"></script><script src="JS/page-guard.js"></script><script src="JS/egypt-governorates.js"></script><script src="JS/contact-segments.js"></script><script src="JS/portal-customers-admin.js"></script></body></html>
