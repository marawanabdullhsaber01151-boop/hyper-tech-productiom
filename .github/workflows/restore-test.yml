name: restore-test
# اختبار استرجاع حقيقي كل أحد 02:00 UTC (04:00 القاهرة) + تشغيل يدوي.
# بينزّل آخر نسخة من كل مخزن، يتأكد من البصمة، يفك التشفير، يسترجع في Postgres مؤقت، ويقارن عدد الصفوف لكل جدول.
# القاعدة الحقيقية بتتلمس بس لتسجيل النتيجة في backup_runs (قراءة/كتابة سطر واحد).
on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: restore-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_MAJOR: "17"
      RESTORE_ADMIN_URL: postgres://postgres:ci@localhost:5432/postgres
      BACKUP_AGE_PRIVATE_KEY: ${{ secrets.BACKUP_AGE_PRIVATE_KEY }}
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
      B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backup-tools
        with:
          pg-major: "17"
      - name: استرجاع ومقارنة
        run: bash scripts/backup/restore-test.sh
