name: backup
# نسخة احتياطية مشفّرة يوميًا 03:30 بتوقيت القاهرة (00:30 UTC) + تشغيل يدوي.
# pg_dump ← تشفير age بالمفتاح العام ← رفع لكل مخزن مضبوط (R2 / B2) ← تنظيف القديم ← تسجيل في backup_runs.
# أي فشل = الـworkflow يفشل وGitHub يبعتلك إيميل، وصفحة «صحة النظام» بتبقى حمرا.
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PG_MAJOR: "17"
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
      B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backup-tools
        with:
          pg-major: "17"
      - name: نسخ احتياطي مشفّر
        run: bash scripts/backup/backup.sh
