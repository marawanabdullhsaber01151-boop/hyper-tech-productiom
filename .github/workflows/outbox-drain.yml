name: outbox-drain
# عامل صندوق الصادر المضمون: بينادي /api/v1/cron/outbox-drain كل 15 دقيقة، فأي إشعار أو تنبيه فشل إرساله بيتعاد
# بتراجع زمني (دقيقة، 5، 30، ساعتين، 12 ساعة) لحد 6 محاولات. بدل cron جديد على Vercel (الخطة المجانية اتنين بس).
# محتاج أسرار: APP_BASE_URL (مثال https://example.com من غير / في الآخر) و CRON_SECRET (نفس قيمة Vercel). ناقصين = بيتخطى بتحذير.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: outbox-drain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: تصريف الصندوق
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_BASE_URL أو CRON_SECRET مش مضبوطين في أسرار GitHub، فالتصريف اتخطى."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL%/}/api/v1/cron/outbox-drain" | tee "$RUNNER_TEMP/drain.json"
          echo
