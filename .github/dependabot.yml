version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # التحديثات الكبيرة (major) بتتعمل يدويًا وبقرار، مش تلقائيًا.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # esbuild مثبّت على نسخة بعينها لأن esbuild-plugin-pino بيشترط نسخة <= 0.25.8 (ترقيته لوحده بيكسر npm ci).
      - dependency-name: "esbuild"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
