<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bd8'/%3E%3Cpath d='M9 9v14M23 9v14M9 16h14' stroke='%23fff' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Hyper-Tech</title>
    <script>
      /* بيحط الثيم قبل أول رسم عشان مفيش وميض. نفس مفاتيح التخزين اللي في theme-runtime.ts */
      try {
        var c = JSON.parse(localStorage.getItem("hypertech-theme-v2") || "{}");
        var m = c.mode || localStorage.getItem("hypertech-theme-mode");
        if (m === "light" || m === "dark") document.documentElement.dataset.theme = m;
        if (c.density) document.documentElement.dataset.density = c.density;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
